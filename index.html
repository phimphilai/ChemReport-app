<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChemReport</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
}

body{
  background:#f4f7fb;
  color:#1e293b;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
  border:none;
}

.app{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:250px;
  background:#0f4c81;
  color:white;
  padding:25px 15px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  overflow-y:auto;
}

.logo{
  text-align:center;
  margin-bottom:30px;
}

.logo-icon{
  font-size:42px;
}

.logo h1{
  font-size:25px;
  margin-top:5px;
}

.logo p{
  font-size:12px;
  opacity:.8;
}

.menu-title{
  font-size:11px;
  opacity:.65;
  margin:20px 12px 8px;
}

.menu button{
  width:100%;
  padding:13px 14px;
  margin:4px 0;
  border-radius:10px;
  background:transparent;
  color:white;
  text-align:left;
  font-size:14px;
}

.menu button:hover,
.menu button.active{
  background:rgba(255,255,255,.16);
}

/* MAIN */
.main{
  margin-left:250px;
  width:calc(100% - 250px);
  min-height:100vh;
}

.topbar{
  height:70px;
  background:white;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
}

.topbar h2{
  font-size:20px;
}

.user{
  font-size:14px;
  color:#64748b;
}

.content{
  padding:30px;
}

/* PAGE */
.page-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.page-title h2{
  font-size:25px;
}

.page-title p{
  color:#64748b;
  margin-top:5px;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:25px;
}

.card{
  background:white;
  border-radius:15px;
  padding:22px;
  box-shadow:0 3px 12px rgba(15,23,42,.06);
  border:1px solid #edf0f5;
}

.card-icon{
  font-size:28px;
  margin-bottom:12px;
}

.card-number{
  font-size:28px;
  font-weight:700;
}

.card-label{
  color:#64748b;
  font-size:13px;
  margin-top:4px;
}

/* ACTION */
.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  padding:11px 17px;
  border-radius:9px;
  font-weight:600;
}

.btn-primary{
  background:#0f6bb5;
  color:white;
}

.btn-primary:hover{
  background:#0b5b9b;
}

.btn-secondary{
  background:#e8f1f8;
  color:#0f4c81;
}

.btn-danger{
  background:#fee2e2;
  color:#b91c1c;
}

/* PANEL */
.panel{
  background:white;
  border-radius:15px;
  padding:22px;
  box-shadow:0 3px 12px rgba(15,23,42,.05);
  border:1px solid #edf0f5;
}

.panel-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
  gap:15px;
  flex-wrap:wrap;
}

.search{
  width:280px;
  padding:11px 14px;
  border:1px solid #d8dee8;
  border-radius:9px;
  outline:none;
}

.search:focus{
  border-color:#0f6bb5;
}

/* TABLE */
.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:800px;
}

th{
  background:#f8fafc;
  color:#475569;
  font-size:13px;
  text-align:left;
  padding:14px;
  border-bottom:1px solid #e2e8f0;
}

td{
  padding:14px;
  border-bottom:1px solid #eef2f7;
  font-size:14px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
}

.badge-green{
  background:#dcfce7;
  color:#15803d;
}

.badge-yellow{
  background:#fef3c7;
  color:#a16207;
}

.badge-red{
  background:#fee2e2;
  color:#b91c1c;
}

.empty{
  text-align:center;
  padding:40px;
  color:#94a3b8;
}

/* QUICK */
.quick{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.quick button{
  background:white;
  padding:22px;
  border-radius:13px;
  text-align:left;
  border:1px solid #e5e7eb;
  transition:.2s;
}

.quick button:hover{
  transform:translateY(-2px);
  box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.quick-icon{
  font-size:28px;
  margin-bottom:10px;
}

.quick-title{
  font-weight:700;
}

.quick-text{
  color:#64748b;
  font-size:12px;
  margin-top:5px;
}

  inset:0;
  background:rgba(15,23,42,.
